name: Private security channel request
description: Ask for a private reporting channel when GitHub private vulnerability reporting is unavailable.
title: "[Private security contact request]: "
body:
  - type: markdown
    attributes:
      value: |
        This form creates a public issue. Use it only when GitHub will not let you open a private security advisory for the affected repository.

        Ask for a private channel. Do not identify the affected package or system, and do not include vulnerability details, exploit steps, credentials, private package data, logs, stack traces, screenshots, or reproduction material.
  - type: checkboxes
    id: no_details
    attributes:
      label: Public-data check
      options:
        - label: I confirm that this public issue identifies no affected system and contains no security details or sensitive evidence.
          required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Ask the maintainers to arrange a private security channel. Include no other information.
      placeholder: I cannot use GitHub private vulnerability reporting. Please arrange a private security channel.
    validations:
      required: true
