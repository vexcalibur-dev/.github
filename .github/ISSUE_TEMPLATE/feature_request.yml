name: Feature request
description: Propose a capability or compatibility change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include vulnerability details, credentials, private package data, internal URLs, or sensitive logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task cannot be completed today? Describe the user and the constraint.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a user should observe. An implementation name is not enough.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example workflow
      description: Show how the capability would be used with synthetic or public data.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Name any command, Python API, action input, output format, or integration that may need to change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do now, and why is it insufficient?
  - type: checkboxes
    id: public_data
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, vulnerability details, private package data, internal URLs, sensitive paths, and personal information.
          required: true
