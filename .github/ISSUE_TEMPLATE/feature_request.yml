name: Feature request
description: Suggest a capability or compatibility improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, exploit details, secrets, tokens, private package data, or sensitive logs in public issues.
        Use GitHub private vulnerability reporting from the repository Security tab, or ask maintainers for a private disclosure channel without sharing details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or compatibility gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior or interface you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches, tools, or formats considered.
