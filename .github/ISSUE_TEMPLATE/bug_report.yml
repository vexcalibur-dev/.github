name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, exploit details, secrets, tokens, private package data, or sensitive logs in public issues.
        Use GitHub private vulnerability reporting from the repository Security tab, or ask maintainers for a private disclosure channel without sharing details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Steps, input files, package URLs, or commands needed to reproduce the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, tool version, and relevant CI details. Redact secrets, tokens, private package names, and sensitive paths.
