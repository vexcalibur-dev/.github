name: Bug report
description: Report a reproducible failure in public, non-sensitive behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Use synthetic or already-public examples and redact logs.

        If the problem may be a vulnerability, stop and use private vulnerability reporting from the repository's Security page. Do not put exploit details, credentials, private package data, or other sensitive evidence here.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure and its effect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest command or workflow that reproduces the problem. Use synthetic package URLs and sanitized input.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected and why.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Vexcalibur project and version, operating system, Python version, and relevant CI runner. Redact private names and paths.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add the smallest redacted output that helps explain the failure. Do not attach a private SBOM or unredacted log.
  - type: checkboxes
    id: public_data
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, vulnerability details, private package data, internal URLs, sensitive paths, and personal information.
          required: true
