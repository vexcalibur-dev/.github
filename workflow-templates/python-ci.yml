name: Python CI

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_CACHE_DIR: /tmp/poetry-cache
  POETRY_VERSION: "2.4.1"
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: Check package metadata
        run: poetry check

      - name: Check lock file
        run: poetry check --lock

      - name: Check formatting
        run: poetry run ruff format --check src tests

      - name: Lint
        run: poetry run ruff check src tests

      - name: Type check
        run: poetry run mypy src

      - name: Audit Python dependencies
        run: poetry run pip-audit --cache-dir /tmp/python-ci-pip-audit-cache

      - name: Scan pull request for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/contents/.secrets.baseline?ref=${BASE_SHA}" --jq .content \
            | base64 --decode > /tmp/base.secrets.baseline
          git ls-files -z | xargs -0 poetry run -- detect-secrets-hook --baseline /tmp/base.secrets.baseline --

      - name: Scan pushed code for secrets
        if: github.event_name != 'pull_request'
        run: git ls-files -z | xargs -0 poetry run -- detect-secrets-hook --baseline .secrets.baseline --

      - name: Test
        run: poetry run pytest

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: poetry

      - name: Build distributions
        run: poetry build
